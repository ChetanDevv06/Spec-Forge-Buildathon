<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecForge — Academic Course Specification Builder</title>
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Tailwind CSS with Forms & Container Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            colors: {
              sidebar: {
                top: '#DCF6F7',
                bottom: '#D6F2EA',
              },
              workspace: '#FBF9F5',
              focusCard: '#182138',
              brand: {
                forest: '#173D35',
                leaf: '#32765B',
                sage: '#A5BFA8',
              },
              primary: {
                DEFAULT: '#0456c5',
                container: '#3470df',
                fixed: '#d9e2ff',
              },
              secondary: {
                DEFAULT: '#5f3cd9',
                container: '#7958f4',
                fixed: '#e6deff',
              },
              tertiary: {
                DEFAULT: '#006387',
                fixed: '#c4e7ff',
              }
            },
            boxShadow: {
              'window': '0 25px 60px -15px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.06)',
              'card': '0 2px 8px -2px rgba(16, 24, 40, 0.05), 0 1px 4px -1px rgba(16, 24, 40, 0.03)',
              'pill-btn': '0 4px 14px 0 rgba(79, 70, 229, 0.35)',
              'subtle': '0 2px 6px rgba(0,0,0,0.04)',
            }
          }
        }
      };
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #dfdbd5;
        background-image: 
          radial-gradient(at 0% 0%, rgba(240, 238, 233, 0.9) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(210, 206, 199, 0.8) 0px, transparent 50%);
      }
      .bar-hatch {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.4) 2px,
          transparent 2px,
          transparent 4px
        );
      }
      /* Custom scrollbar for clean academic workspace */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
